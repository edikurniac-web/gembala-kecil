name: gembala_kecil
description: Cerita Alkitab interaktif untuk anak.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.17
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
  assets:
    - assets/brand/
    - assets/brand/icons/
    - assets/content/catalog.json
    - assets/content/daud-dan-goliat-cover.png
    - assets/content/daud-dan-goliat-narration.mp3
    - assets/content/daud-dan-goliat-timing.json
    - assets/content/daud-dan-goliat-page-1.png
    - assets/content/daud-dan-goliat-page-2.png
    - assets/content/daud-dan-goliat-page-3.png
    - assets/content/daud-dan-goliat-page-4.png
    - assets/content/daud-dan-goliat-page-5.png
    - assets/content/daud-dan-goliat-page-6.png
    - assets/content/daud-dan-goliat-page-7.png
    - assets/content/daud-dan-goliat-edit-a74498f4-cc08-4236-8fd4-ef51ffeea4ad-page-8.png
    - assets/content/daud-dan-goliat-edit-a74498f4-cc08-4236-8fd4-ef51ffeea4ad-page-9.png
    - assets/content/daud-dan-goliat-page-10.png
    - assets/content/daud-dan-goliat-page-11.png
    - assets/content/daud-dan-goliat-page-12.png
    - assets/content/kasih-allah-verse.png
    - assets/content/kasih-allah-verse.mp3
