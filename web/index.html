<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gembala_kecil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>gembala_kecil</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #fffaf0;
    }
    #flutter-startup {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 18px;
      color: #1e344e;
      font: 600 17px/1.4 system-ui, sans-serif;
      text-align: center;
    }
    #flutter-startup img {
      width: min(230px, 58vw);
      height: auto;
    }
    #flutter-startup.failed .startup-dot {
      display: none;
    }
    .startup-dot {
      width: 30px;
      height: 30px;
      border: 4px solid #d9f0ec;
      border-top-color: #1d9ea2;
      border-radius: 50%;
      animation: startup-spin .8s linear infinite;
    }
    @keyframes startup-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="flutter-startup" role="status" aria-live="polite">
    <img src="assets/assets/brand/logo.png" alt="Gembala Kecil">
    <div class="startup-dot" aria-hidden="true"></div>
    <div class="startup-copy">Menyiapkan cerita untukmu…</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=20260915-2" async></script>
</body>
</html>
